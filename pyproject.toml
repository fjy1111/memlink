[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentipc"
version = "0.1.0"
description = "Low-overhead communication, shared state, and persistent memory runtime for multi-agent collaboration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0,<3.0",
    "numpy>=1.24",
    "psutil>=5.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "wheel>=0.41",
]
dashboard = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "httpx>=0.27,<1.0",
]
openai = [
    "openai>=3.0,<4.0",
]
sentence-transformers = [
    "sentence-transformers>=6.0,<7.0",
]
tiktoken = [
    "tiktoken>=0.7,<1.0",
]

[project.scripts]
agentipc = "agentipc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/agentipc/dashboard" = [
    "src/agentipc/dashboard/static/index.html",
    "src/agentipc/dashboard/static/app.js",
    "src/agentipc/dashboard/static/styles.css",
]

[tool.setuptools.package-data]
agentipc = [
    "dashboard/static/*",
    "resources/configs/*",
]
